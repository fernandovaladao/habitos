{{define "change-password"}}
<!doctype html>
<html lang="pt-BR">
{{template "head" .}}
<body>
  <header class="site-header">{{template "brand" .}}</header>
  <main class="auth-shell">
    <section class="card form-card">
      <p class="eyebrow">Conta e segurança</p>
      <h1>Alterar senha</h1>
      <p>Por segurança, confirme sua senha atual.</p>
      <form data-password-form data-email="{{.Email}}">
        <label for="current-password">Senha atual</label>
        <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
        <label for="new-password">Nova senha</label>
        <input id="new-password" name="newPassword" type="password" minlength="6" autocomplete="new-password" required>
        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
        <button class="button button--primary" type="submit">Alterar senha</button>
      </form>
      <div class="form-links"><a href="/perfil">Voltar ao perfil</a></div>
    </section>
  </main>
  <script type="module" src="/static/js/password.js"></script>
</body>
</html>
{{end}}
