{{define "password-reset"}}
<!doctype html>
<html lang="pt-BR">
{{template "head" .}}
<body>
  <header class="site-header">{{template "brand" .}}</header>
  <main class="auth-shell">
    <section class="card form-card">
      <p class="eyebrow">Recupere seu acesso</p>
      <h1>Recuperar senha</h1>
      <p>Informe seu e-mail para receber as instruções do Firebase Authentication.</p>
      <form data-auth-form="password-reset">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
        <button class="button button--primary" type="submit">Enviar instruções</button>
      </form>
      <div class="form-links"><a href="/entrar">Voltar para entrar</a></div>
    </section>
  </main>
  <script type="module" src="/static/js/auth.js"></script>
</body>
</html>
{{end}}
